<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FBM • Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="header"><h1>Behavior Builder <span class="badge">FBM</span></h1><div></div></div>

  <main class="centered">
    <section class="card">
      <div class="hero">
        <h1>Welcome</h1>
        <p>Focus-first logging, research-grade exports. Your data stays on this device unless you export it.</p>
      </div>

      <div id="accounts" class="list" aria-label="Accounts"></div>

      <hr style="border:0;border-top:1px solid var(--card-border);margin:14px 0"/>

      <div class="field"><label>Display name</label><input id="name" placeholder="e.g., Taechasith"/></div>
      <div class="field"><label>Email (optional)</label><input id="email" type="email" placeholder="you@example.com"/></div>
      <div class="field"><label>PIN (optional, 4–12 digits)</label><input id="pin" type="password" inputmode="numeric"/></div>
      <div class="toggle-row"><span>Private Session (erase on browser close)</span><div id="privateToggle" class="toggle off" tabindex="0">No</div></div>

      <div style="display:flex;gap:10px;margin-top:8px">
        <button id="createBtn" class="btn primary">Create & Use</button>
        <button id="guestBtn" class="btn ghost">Continue as Guest</button>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
