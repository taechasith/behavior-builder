<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FBM • Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="header">
    <h1>Behavior Builder <span class="badge">FBM</span></h1>
    <div>
      <span id="userBadge" class="badge">User: —</span>
      <a class="btn ghost" href="collect.html">➕ Log today</a>
      <button id="exportBtn" class="btn ghost">📤 Export</button>
      <button id="importBtn" class="btn ghost">📥 Import</button>
      <button id="signOutBtn" class="btn danger">Sign out</button>
      <input id="importFile" type="file" accept="application/json,text/csv" hidden/>
    </div>
  </div>

  <main class="grid">
    <!-- Behaviors -->
    <section class="card">
      <h2>My Behaviors</h2>
      <button id="addBehaviorBtn" class="btn primary" style="margin-bottom:8px">➕ Add Behavior</button>
      <ul id="behaviorList" class="list"></ul>
    </section>

    <!-- Graph -->
    <section class="card focus">
      <h2>FBM Graph</h2>
      <div class="legend">
        <span class="dot success"></span> success
        <span class="dot borderline"></span> borderline
        <span class="dot fail"></span> fail
      </div>
      <div class="graph-controls">
        <label>Show last <span id="daysVal">14</span>d</label>
        <input id="rangeDays" type="range" min="7" max="90" step="1" value="14"/>
        <label><input id="showPathChk" type="checkbox" checked/> Show path</label>
        <label><input id="showSeqChk" type="checkbox"/> Sequence #</label>
      </div>
      <div class="svg-wrap"><svg id="fbmGraph" viewBox="0 0 420 420" width="420" height="420" role="img"></svg></div>
      <div id="pointDetails" class="point-details">Hover or tap a point to see its details.</div>
    </section>

    <!-- History -->
    <section class="card">
      <h2>Recent History</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>M</th><th>A</th><th>Did</th><th>Note</th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Simple modal substitute (prompt-based for Python1 level) is fine -->

  <script src="js/common.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
