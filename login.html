<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FBM • Sign in</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Behavior Builder <span class="subtle">(FBM)</span></h1>
    <div class="nav"><a href="#" class="badge">v1</a></div>
  </header>

  <main class="centered card">
    <h2>Welcome</h2>
    <p class="note">Your data stays on this device unless you export it.</p>

    <h3>Sign in</h3>
    <div id="accounts" class="list"></div>

    <hr style="border-color:var(--card-border);margin:16px 0">

    <h3>Create account</h3>
    <div class="field"><label>Name</label><input id="name" placeholder="e.g., Taechasith"></div>
    <div class="field"><label>Email (optional)</label><input id="email" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>PIN (optional, 4–12 digits)</label><input id="pin" type="password" inputmode="numeric"></div>
    <div class="field">
      <label class="note"><input id="privateSession" type="checkbox"> Private Session (store in session only)</label>
    </div>
    <button id="createBtn" class="btn primary">Create & Use</button>

    <hr style="border-color:var(--card-border);margin:16px 0">

    <h3>Guest</h3>
    <p class="note">Temporary profile — cleared when the browser closes.</p>
    <button id="guestBtn" class="btn ghost">Continue as Guest</button>
  </main>

  <script src="core.js"></script>
  <script>
    const { loadAccounts, saveAccounts, setCurrent, rid, sha256Hex, esc } = FBMCore;
    const $ = s => document.querySelector(s);
    const box = $("#accounts");

    function renderAccounts(){
      const list = loadAccounts();
      box.innerHTML = "";
      if(list.length === 0){
        box.innerHTML = '<div class="note">No users yet.</div>';
        return;
      }
      list.forEach(acc => {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <div><strong>${esc(acc.name)}</strong><br><span class="note">${esc(acc.email||"")}</span></div>
          <div>
            <button class="btn small ghost" data-id="${acc.userId}">Use</button>
            <button class="btn small danger" data-del="${acc.userId}">Delete</button>
          </div>`;
        box.appendChild(row);
      });
    }
    renderAccounts();

    // event delegation (no {once:true})
    box.addEventListener("click", async (e)=>{
      const id = e.target.dataset.id;
      const del = e.target.dataset.del;
      if(id){
        const acc = loadAccounts().find(a=>a.userId===id);
        if(!acc) return;
        if(acc.pinHash){
          const pin = prompt("Enter PIN:") || "";
          const hash = await sha256Hex(pin);
          if(hash !== acc.pinHash){ alert("Wrong PIN."); return; }
        }
        setCurrent(acc);
        location.href = "app.html";
      }
      if(del){
        if(!confirm("Delete this user and local data?")) return;
        const next = loadAccounts().filter(a=>a.userId!==del);
        saveAccounts(next);
        renderAccounts();
      }
    });

    $("#createBtn").addEventListener("click", async ()=>{
      const name = $("#name").value.trim(); if(!name){alert("Enter a name");return;}
      const email = $("#email").value.trim();
      const pin = $("#pin").value.trim();
      const pinHash = pin ? await sha256Hex(pin) : null;
      const acc = {
        userId: rid(),
        name, email, pinHash,
        createdAt: new Date().toISOString(),
        privateSession: $("#privateSession").checked
      };
      const list = loadAccounts(); list.push(acc); saveAccounts(list);
      setCurrent(acc); location.href = "app.html";
    });

    $("#guestBtn").addEventListener("click", ()=>{
      const acc = { userId:`guest_${rid(8)}`, name:"Guest", email:"", pinHash:null, createdAt:new Date().toISOString(), privateSession:true };
      const list = loadAccounts(); list.push(acc); saveAccounts(list);
      setCurrent(acc); location.href = "app.html";
    });
  </script>
</body>
</html>
